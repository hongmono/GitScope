name: GitScope
options:
  bundleIdPrefix: dev.hongmono
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
targets:
  GitScope:
    type: application
    platform: macOS
    sources:
      - path: GitScopeApp
    info:
      path: GitScopeApp/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://github.com/hongmono/GitScope/releases/latest/download/appcast.xml
        SUPublicEDKey: KHNNL8lXiV2YiQn694vO58zEUvEJawhQZe6h2Yw7l7k=
        SUEnableAutomaticChecks: true
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          APP_DISPLAY_NAME: GitScope Dev
          PRODUCT_BUNDLE_IDENTIFIER: dev.hongmono.gitscope.debug
          PRODUCT_NAME: GitScope Dev
        Release:
          APP_DISPLAY_NAME: GitScope
          PRODUCT_BUNDLE_IDENTIFIER: dev.hongmono.gitscope
          PRODUCT_NAME: GitScope
    dependencies:
      - package: Sparkle
    scheme:
      gatherCoverageData: false
      testTargets:
        - GitScopeTests
  GitScopeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GitScopeTests
      # 앱을 TEST_HOST 로 띄우지 않는 순수 로직 테스트 번들이라, 검증 대상 소스를
      # 테스트 모듈에 직접 컴파일한다. (앱 실행 없이 테스트가 돌고, CI 서명도 불필요)
      - path: GitScopeApp/Models/GitModels.swift
      - path: GitScopeApp/Services/CommitGraphLayout.swift
      - path: GitScopeApp/Services/GitRepositoryLoader.swift
      - path: GitScopeApp/Services/GitCommandRunner.swift
      - path: GitScopeApp/Services/GitRemoteService.swift
      - path: GitScopeApp/Services/GitBranchService.swift
      - path: GitScopeApp/Services/RepositoryScanner.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
